##
# aria2-pro 钩子脚本配置文件
# 所有选项均可用 # 注释或留空
##

########## 上传设置 (upload.sh) ##########

# rclone 配置中的网盘名称(name)
drive-name=OneDrive

# 网盘目标目录, 网盘内的文件夹路径。
# 留空或注释 = 网盘根目录; 末尾不要带斜杠。
#drive-dir=/Backup/Downloads

# 上传日志保存路径。留空或注释 = 不记录。
#upload-log=/root/.aria2/upload.log

# rclone 并发传输数(小文件多时适当调高)
rclone-transfers=4

# rclone 并发检查数
rclone-checkers=8

########## 移动设置 (move.sh) ##########

# 本地移动的目标目录
dest-dir=/root/completed

# 移动日志保存路径。留空或注释 = 不记录。
#move-log=/root/.aria2/move.log

########## 删除设置 (delete.sh) ##########

# 下载出错时删除本地文件
delete-on-error=true

# 任务被移除时删除本地文件
delete-on-removed=true

# 任务被强制删除且无法读取任务信息时删除文件(第三方工具场景)
delete-on-unknown=true

########## 清理设置(全局) ##########

# 删除 .aria2 控制文件
delete-dot-aria2=true

# 删除 .torrent 种子文件。可选: normal | enhanced | true | false
#   normal   : 只删除能通过 infoHash 定位到的种子
#   enhanced : 扫描下载目录, 删除所有非活动任务的种子(非实时)
#   true     : 优先 normal, 定位不到时用 enhanced
#   false    : 不删除
delete-dot-torrent=true

# 删除空的子目录
delete-empty-dir=true

########## 文件过滤(BT 多文件任务) ##########

# 仅对多文件任务(FILE_NUM > 1)生效

# 排除小于此体积的文件, 支持 K/M/G 后缀
#min-size=10M

# 白名单扩展名(保留这些, 删除其余), 用 | 分隔
#include-file=mp4|mkv|rmvb|mov|avi

# 黑名单扩展名(删除这些), 用 | 分隔
#exclude-file=html|url|lnk|txt|jpg|png|nfo

# 白名单正则(保留匹配项, 删除其余)
#include-file-regex=

# 黑名单正则(删除匹配项), 例如剔除比特彗星的 padding file
#exclude-file-regex="(.*/)_+(padding)(_*)(file)(.*)(_+)"
