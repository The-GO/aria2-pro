##
# Aria2 配置文件 — aria2-pro v4.0.0
# 适用于 aria2 >= 1.37.0
#
# 与上游 P3TERX/aria2.conf 的差异：
#   - max-connection-per-server 上限在 aria2 1.36+ 收紧为 16，上游写 32 会
#     导致 1.37 直接拒绝启动（errorCode=1），此处已修正。
#   - 移除了上游脚本会注入、但 aria2 1.37 已删除的 retry-on-400/403/406/unknown。
#   - 增加 rpc-allow-origin-deny / rpc-secure 相关注释说明。
##

## 文件保存相关 ##

# 文件的保存路径(可使用绝对路径或相对路径), 默认: 当前启动位置
dir=/root/downloads

# 下载文件的断点续传
continue=true

# 每次暂停下载时保存会话文件
save-session=/root/.aria2/aria2.session

# 会话文件的保存间隔(秒)
save-session-interval=30

# 下载文件的预分配模式
# none < falloc < trunc < prealloc
# falloc/trunc 在大文件上能减少碎片, prealloc 最慢但最稳妥
file-allocation=falloc

# 磁盘缓存(0 表示由 aria2 自动决定)
disk-cache=64M

## 下载连接相关 ##

# 最大同时下载任务数, 运行时可修改, 默认:5
max-concurrent-downloads=5

# 同一服务器连接数, 默认:1
max-connection-per-server=16

# 单个任务分片数, 默认:5
split=16

# 整体下载速度限制, 默认:0(不限制)
max-overall-download-limit=0

# 单个任务下载速度限制, 默认:0(不限制)
max-download-limit=0

# 整体上传速度限制, 默认:0(不限制)
max-overall-upload-limit=0

# 单个任务上传速度限制, 默认:0(不限制)
max-upload-limit=0

# 断开下载速度慢的连接, 默认:false
lowest-speed-limit=0

# 校验文件完整性, 默认:false
check-integrity=false

# 检查证书, 默认:false
check-certificate=false

# 证书颁发机构文件路径
# ca-certificate=/etc/ssl/certs/ca-certificates.crt

## BT/PT 下载相关 ##

# 当下载的是一个种子(以.torrent结尾)时, 自动开始BT任务, 默认:true
follow-torrent=true

# 保存种子文件, 默认:true
bt-save-metadata=true

# 单个种子最大连接数, 默认:55
bt-max-peers=55

# 是否开启dht, 默认:true
enable-dht=true

# 是否开启dht6, 默认:false
enable-dht6=false

# 本地节点查找, 默认:false
bt-enable-lpd=true

# 种子交换, 默认:true
enable-peer-exchange=true

# 指定用于本地节点发现的接口, 可以指定多次
# bt-lpd-interface=eth0

# 注意: aria2 没有独立的 bt-lpd-port 选项, 本地节点发现复用 listen-port

# 设置用于 DHT 的 UDP 监听端口范围(同时作用于 IPv4 和 IPv6 DHT)
# 注意: aria2 没有 dht-listen-port6 选项, 统一由 dht-listen-port 控制
dht-listen-port=6881-6999

# 设置 BT 监听的 TCP 端口范围
listen-port=51413-51500

# 设置速率, 用于限制上传/下载速度, 默认:50K
# bt-request-peer-speed-limit=50K

# 当种子的分享率达到这个数后, 自动停止做种, 默认:1.0
seed-ratio=1.0

# 时间为0时持续做种, 默认:0
seed-time=0

# 强制保存会话, 即使任务已经完成, 默认:false
# 较新的版本出于其安全性已经移除
# force-save=false

# 是否为BT任务也启用续传, 默认:false
bt-remove-unselected-file=true

# 客户端伪装
peer-id-prefix=-UT3430-
user-agent=Transmission/3.41
peer-agent=Transmission/3.41

# 当种子文件不存在时继续下载, 默认:true
bt-load-saved-metadata=true

# BT Tracker 服务器地址
bt-tracker=udp://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://tracker.torrent.eu.org:451/announce

## RPC 相关设置 ##

# 启用RPC, 默认:false
enable-rpc=true

# 允许所有来源, 默认:false
rpc-allow-origin-all=true

# 允许非外部访问, 默认:false
rpc-listen-all=true

# 事件轮询方式, 可选值为[epoll, kqueue, port, poll, select], 默认:自动检测
# event-poll=epoll

# RPC监听端口, 端口被占用时可以修改, 默认:6800
rpc-listen-port=6800

# 设置的RPC授权令牌, v1.18.4之后, 该选项已废弃并将被忽略
# rpc-user=

# 设置的RPC授权令牌, v1.18.4之后, 该选项已废弃并将被忽略
# rpc-passwd=

# 在RPC中设置加密密钥, 建议设置以提升安全性
rpc-secret=changeme

# 是否启用 RPC over SSL/TLS, 默认:false
# 启用后所有 RPC 通信将使用 HTTPS, 需配合 rpc-certificate/rpc-private-key 使用
# rpc-secure=true

# RPC 证书路径(启用 rpc-secure 时必填)
# rpc-certificate=/root/.aria2/aria2.crt

# RPC 私钥路径(启用 rpc-secure 时必填)
# rpc-private-key=/root/.aria2/aria2.key

# 是否在 RPC 服务中启动 SSL/TLS, 默认:false
# 与 rpc-secure 等价, 兼容旧配置文件名
# rpc-secure=false

## 日志相关 ##

# 日志文件路径
log=/root/.aria2/aria2.log

# 日志级别, 可选值为[debug, info, notice, warn, error], 默认:debug
log-level=warn

# 日志中是否显示控制台输出, 默认:false
console-log-level=notice

# 是否在日志中显示下载进度
# summary-interval=0

## 高级设置 ##

# 是否开启异步DNS, 默认:true
async-dns=true

# 异步DNS服务器列表
# async-dns-server=8.8.8.8,1.1.1.1

# 是否保存 DNS 缓存
# async-dns-cache=true

# 启用IPv6, 默认:false
# disable-ipv6=false

# 指定用于连接的接口, 可以指定多次
# interface=eth0

# 是否开启本地代理(GOAHEAD)
# all-proxy=

# 进度保存的间隔(秒), 默认:60
# auto-save-interval=20

# 是否开启文件分配的磁盘预写, 默认:true
# no-file-allocation-limit=32M

## 内存映射与性能 ##

# 是否使用内存映射文件, 默认:false
# mmap=true

# 是否将文件写入缓冲区, 默认:false
# rlimit-nofile=10000

# 是否关闭颜色输出, 默认:false
# quiet=false

## 断点续传相关 ##

# 下载完成后是否保留.aria2控制文件, 默认:false
# 由 clean.sh 钩子处理, 无需在此设置

## 自动更新 BT-Tracker ##

# aria2-pro 提供 tracker-update.sh 工具脚本, 参见 docs/tracker.md
# 建议通过 cron 每日更新一次

## 钩子脚本(aria2-pro) ##

# 下载完成后执行的命令(清理/上传/移动)
on-download-complete=/root/.aria2/hooks/clean.sh

# BT 任务下载完成后执行的命令
on-bt-download-complete=/root/.aria2/hooks/clean.sh

# 下载停止时执行的命令(含错误、暂停、移除)
on-download-stop=/root/.aria2/hooks/delete.sh

# 下载出错时执行的命令(未定义则回退到 on-download-stop)
on-download-error=/root/.aria2/hooks/delete.sh

# 下载暂停时执行的命令(未定义则回退到 on-download-stop)
#on-download-pause=/root/.aria2/hooks/delete.sh

# 下载开始前执行的命令
#on-download-start=/root/.aria2/hooks/clean.sh

# 是否允许钩子脚本的 stderr 输出被 aria2 记录
# 建议保持开启以便排查
enable-mmap=false
